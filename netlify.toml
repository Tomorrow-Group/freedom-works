# Netlify rebuilds the site from the source on every change pushed to GitHub.
[build]
  command = "pip install -r requirements.txt && python3 fetch_thinking_images.py && python3 build.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

# Long caching for media that never changes name; pages always fresh.
[[headers]]
  for = "/assets/film/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
